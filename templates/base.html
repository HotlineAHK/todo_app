<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Трекер задач</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4 shadow-sm">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand fw-bold" href="/">📋 Трекер задач</a>
            <button class="btn btn-outline-secondary btn-sm" id="themeToggle">🌙 Тёмная тема</button>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script>
        const toggleBtn = document.getElementById("themeToggle");
        const htmlTag = document.documentElement;
        const savedTheme = localStorage.getItem("theme") || "light";
        htmlTag.setAttribute("data-bs-theme", savedTheme);
        toggleBtn.textContent = savedTheme === "dark" ? "☀️ Светлая тема" : "🌙 Тёмная тема";

        toggleBtn.addEventListener("click", () => {
            const currentTheme = htmlTag.getAttribute("data-bs-theme");
            const newTheme = currentTheme === "light" ? "dark" : "light";
            htmlTag.setAttribute("data-bs-theme", newTheme);
            localStorage.setItem("theme", newTheme);
            toggleBtn.textContent = newTheme === "dark" ? "☀️ Светлая тема" : "🌙 Тёмная тема";
        });
    </script>
</body>
</html>
